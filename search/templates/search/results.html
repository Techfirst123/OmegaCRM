<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Results for {{ query }}</title>
  </head>
  <body>
    <h1>Results for "{{ query }}"</h1>
    <a href="/">Back</a>
    <ul>
      {% for doc in results %}
      <li>
        <strong>{{ doc.title }}</strong><br />
        {{ doc.file_path }}<br />
        <p>{{ doc.content|truncatechars:300 }}</p>
      </li>
      {% empty %}
      <li>No results found.</li>
      {% endfor %}
    </ul>
  </body>
</html>
